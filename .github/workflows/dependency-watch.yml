# Advisory surveillance only: no application build, deploy, update or production secret.
name: Dependency watch
on:
  schedule:
    - cron: "51 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-watch
  cancel-in-progress: false
jobs:
  advisory-inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Current npm advisory inventory against the committed lockfile
        run: npm audit --audit-level=high --json > dependency-advisories.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.3"
          cache-dependency-path: config/go2rtc/go.sum
      - run: node scripts/install-video.mjs
      - run: node scripts/audit-distributed.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-watch-${{ github.sha }}
          path: |
            dependency-advisories.json
            python-advisories.json
            test-results/distributed-audit.json
          retention-days: 14
