# Generated by Platform scripts/render-report-workflows.mjs. No PR checkout or artifact execution.
name: Trusted technical reports
on:
  workflow_run:
    workflows: ["Quasar validation and native packages"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: trusted-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'codex/production-readiness')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
      - name: Read authoritative run metadata and transmit aggregate reports
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PROJECT: quasar
          PLATFORM_REPORT_TOKEN: ${{ secrets.PLATFORM_REPORT_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'TRUSTED_REPORT'
          // This file is embedded in the trusted workflow: no checkout or PR artifact is executed.
          import { writeFile, mkdir } from "node:fs/promises";
          const {
            GITHUB_REPOSITORY: repository,
            RUN_ID: id,
            PROJECT: project,
          } = process.env;
          const repositories = {
            mira: "Jordbmd/mira",
            singularity: "Jordbmd/Singularity",
            orbit: "Jordbmd/Orbit",
            quasar: "Jordbmd/quasar",
            web: "Jordbmd/doublemart-web",
            platform: "Jordbmd/doublemart-platform",
          };
          if (repositories[project] !== repository || !/^\d+$/.test(id || ""))
            throw Error("Invalid trusted report context");
          async function github(path) {
            const response = await fetch(
              `https://api.github.com/repos/${repository}/${path}`,
              {
                headers: {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                },
                redirect: "error",
                signal: AbortSignal.timeout(10000),
              },
            );
            if (!response.ok)
              throw Error(`GitHub report source unavailable (${response.status})`);
            return response.json();
          }
          const run = await github(`actions/runs/${id}`);
          if (
            run.head_repository?.full_name !== repository ||
            !["push", "workflow_dispatch"].includes(run.event) ||
            !["main", "codex/production-readiness"].includes(run.head_branch) ||
            run.status !== "completed" ||
            !/^[a-f0-9]{40}$/.test(run.head_sha)
          )
            throw Error("Untrusted or incomplete workflow run");
          const jobs = [];
          for (let page = 1; page <= 20; page++) {
            const result = await github(
              `actions/runs/${id}/attempts/${run.run_attempt}/jobs?per_page=100&page=${page}`,
            );
            jobs.push(...result.jobs);
            if (jobs.length >= result.total_count) break;
            if (page === 20) throw Error("Job list exceeds report budget");
          }
          const state = (conclusions) =>
            !conclusions.length
              ? "not_run"
              : conclusions.includes("failure")
                ? "failed"
                : conclusions.every((value) => value === "success")
                  ? "ok"
                  : conclusions.every((value) => value === "skipped")
                    ? "not_run"
                    : "unknown";
          const audits = jobs
            .flatMap((job) => job.steps || [])
            .filter(
              (step) =>
                /(?:\baudit\b|bundled relay advisory)/i.test(step.name) &&
                !/artifact/i.test(step.name),
            );
          const reports = [
            ["ci", state([run.conclusion])],
            ["audit", state(audits.map((step) => step.conclusion))],
          ].map(([kind, status]) => ({
            schemaVersion: 1,
            project,
            commit: run.head_sha,
            generatedAt: run.updated_at,
            tool: `github-actions-${id}-${run.run_attempt}`,
            kind,
            status,
            summary: {
              ok: "passed",
              failed: "failed",
              not_run: "not-run",
              unknown: "unavailable",
            }[status],
          }));
          await mkdir("trusted-reports", { recursive: true });
          for (const report of reports) {
            await writeFile(
              `trusted-reports/${report.kind}.json`,
              JSON.stringify(report, null, 2) + "\n",
            );
            if (!process.env.PLATFORM_REPORT_TOKEN) continue;
            const response = await fetch("https://admin.doublemart.fr/api/reports", {
              method: "POST",
              redirect: "error",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${process.env.PLATFORM_REPORT_TOKEN}`,
              },
              body: JSON.stringify(report),
              signal: AbortSignal.timeout(1500),
            });
            if (!response.ok)
              throw Error(`Platform rejected ${report.kind} report (${response.status})`);
            await response.body?.cancel();
          }
          console.log(
            process.env.PLATFORM_REPORT_TOKEN
              ? "Trusted reports accepted by Platform."
              : "Reports retained as artifacts; transmission NOT RUN: server credential is not configured.",
          );
          TRUSTED_REPORT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trusted-reports-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: trusted-reports/
          if-no-files-found: error
          retention-days: 30
