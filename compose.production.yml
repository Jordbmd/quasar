name: doublemart-quasar-portal
services:
  quasar-portal:
    profiles: [production]
    image: ${QUASAR_PORTAL_IMAGE:?Set validated image@sha256 digest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    env_file: [./ops/secrets/portal.env]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4350
      PUBLIC_ORIGIN: https://quasar.doublemart.fr
    expose: ["4350"]
    networks: [edge]
networks:
  edge:
    external: true
    name: doublemart-edge
